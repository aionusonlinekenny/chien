<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Naruto H5 - Nạp tiền</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>
    <script th:src="@{/js/ctxd.js}"></script>
</head>
<body>
<div class="container">
    <!-- Header menu -->
    <div class="bs-example" th:fragment="header">
        <nav class="navbar navbar-expand-md navbar-light bg-light">
            <a th:href="@{/index}" class="navbar-brand">Shine</a>
            <button type="button" class="navbar-toggler" data-toggle="collapse"
                    data-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav">
                    <a th:href="@{/index}" class="nav-item nav-link active">Home</a>
                    <a th:href="@{/charge}" class="nav-item nav-link">Nạp thẻ</a>
                    <a th:href="@{/buy-package}" class="nav-item nav-link">Mua gói</a>
                    <a th:href="@{/gift-code}" class="nav-item nav-link">Gift Code</a>
                    <a th:href="@{/contact}" class="nav-item nav-link">Liên Hệ</a>
                </div>
                <div class="navbar-nav ml-auto">
                    <div class="nav-item nav-link header-name"></div>
                    <a th:href="@{/log-out}" class="nav-item nav-link">Thoát</a>
                </div>
            </div>
        </nav>
    </div>
    <!-- End Header menu -->
    <hr/>
    <h3>Nạp tiền vào hệ thống:</h3>

    <form>
        <div class="form-group">
            <label for="provider">Chọn nhà cung cấp:</label>
            <select class="form-control" id="provider">
                <option value="0">--</option>
                <option value="VNP">Vinaphone</option>
                <option value="MBP">Mobiphone</option>
                <option value="VTT">Vietel</option>
            </select>
        </div>
        <div class="form-group">
            <label for="card-num">Chọn mệnh giá:</label>
            <select class="form-control" id="card-num">
                <option value="0">--</option>
                <option value="10000">50.000</option>
                <option value="50000">50.000</option>
                <option value="100000">100.000</option>
                <option value="200000">200.000</option>
                <option value="500000">500.000</option>
            </select>
        </div>
        <div class="form-group">
            <label for="seri">Nhập seri:</label>
            <input type="text" class="form-control" id="seri" aria-describedby="seri" placeholder="Nhập seri">
        </div>
        <div class="form-group">
            <label for="pin-code">Nhập mã thẻ:</label>
            <input type="text" class="form-control" id="pin-code" placeholder="Nhập mã thẻ">
        </div>
        <button type="button" class="btn btn-primary" id="chargeNow">Nạp ngay</button>
    </form>

    <hr/>
    <h3>Lịch sử nạp:</h3>
    <!-- Table charge -->
    <table id="my-history-charge" class="table table-striped table-bordered"
           style="width: 100%">
        <thead>
        <tr>
            <th>#</th>
            <th>Thời gian</th>
            <th>Loại</th>
            <th>Mệnh giá</th>
            <th>Trạng thái</th>
        </tr>
        </thead>
        <tbody id="my-history">
        <tr>
            <td>1</td>
            <td>2020-12-12 00:05</td>
            <td>VTT</td>
            <td>20.000</td>
            <td>Thành công</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th>#</th>
            <th>Thời gian</th>
            <th>Loại</th>
            <th>Mệnh giá</th>
            <th>Trạng thái</th>
        </tr>
        </tfoot>
    </table>
</div>

<script>
    $(document).ready(function () {
        // gift code
        $("#chargeNow").click(function () {
            chargeNow();
        });

        function chargeNow() {
            var typeNetwork = $("#provider").val();
            var cardValue = $("#card-num").val();
            var seriNum = $("#seri").val();
            var secretNum = $("#pin-code").val();

            if (typeNetwork == 0) {
                alert("Chọn nhà cung cấp!");
                return;
            }
            if (cardValue == 0) {
                alert("Chọn mệnh giá!");
                return;
            }

            if (seriNum == null || seriNum.trim() == "") {
                alert("Vui lòng nhập seri trên thẻ!");
                return;
            }
            if (secretNum == null || secretNum.trim() == "") {
                alert("Vui lòng nhập mã bí mật dưới lớp bạc!");
                return;
            }
            var dataCharge = {typeNetwork: typeNetwork, cardValue: cardValue, seriNum: seriNum, secretNum: secretNum};
            var homeUrl = "";
            if (confirm("Hãy kiểm tra 1 lần nữa mệnh giá, nếu chọn nhầm có thể mất thẻ nạp")) {
                $.ajax({
                    url: homeUrl + "/api/wallet/add",
                    type: "POST",
                    dataType: 'json', headers: {
                        'Authorization': sessionStorage.getItem("token"),
                    },
                    contentType: "application/json",
                    data: JSON.stringify(dataCharge),
                    success: function (response) {
                        alert(response.msg);
                        window.location.href = homeUrl + "/charge";
                    },
                    error: function (jqXHR) {
                        alert("Có lỗi xảy ra: " + jqXHR.responseJSON.msg);
                    }
                });
            }
        }
    });
</script>
</body>
</html>
